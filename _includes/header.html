<header class="site-header wrap">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}<span class="cursor" aria-hidden="true">_</span></a>

  <nav class="site-nav" aria-label="main">
    {%- for item in site.data.nav -%}
      {%- assign href = item.url | relative_url -%}
      <a href="{{ href }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor -%}
  </nav>

  <button class="theme-toggle" type="button" data-theme-toggle>jack-in</button>
</header>
