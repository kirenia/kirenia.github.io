<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#content">skip to content</a>
  {% include header.html %}

  <main class="wrap" id="content">
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    // anything pointing off this site opens in its own tab
    (function () {
      var links = document.querySelectorAll('a[href^="http"]');
      for (var i = 0; i < links.length; i++) {
        var a = links[i];
        if (a.hostname === window.location.hostname || a.target) continue;
        a.target = "_blank";
        a.rel = (a.rel ? a.rel + " " : "") + "noopener noreferrer";
      }
    })();
  </script>

  <script>
    // jack in to the terminal, jack out to daylight
    (function () {
      var btn = document.querySelector("[data-theme-toggle]");
      if (!btn) return;
      var root = document.documentElement;
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

      // no pick yet means we're riding the system setting
      function isDark() {
        return root.dataset.theme ? root.dataset.theme === "dark" : prefersDark.matches;
      }

      function label() {
        var on = isDark();
        btn.textContent = on ? "jack-out" : "jack-in";
        btn.setAttribute("aria-pressed", on ? "true" : "false");
        btn.setAttribute("aria-label", on ? "jack out to light mode" : "jack in to the terminal");
      }

      btn.addEventListener("click", function () {
        var next = isDark() ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });

      function onSchemeChange() {
        if (!root.dataset.theme) label();
      }

      // addListener is the pre-2020 safari spelling
      if (prefersDark.addEventListener) {
        prefersDark.addEventListener("change", onSchemeChange);
      } else if (prefersDark.addListener) {
        prefersDark.addListener(onSchemeChange);
      }

      label();
    })();
  </script>
  <script>document.documentElement.className += " js";</script>

  <script>
    // the list restacks and filters itself. without this it still renders,
    // grouped by media type, and the controls stay hidden.
    (function () {
      var list = document.getElementById("reclist");
      if (!list) return;

      var buttons = [].slice.call(document.querySelectorAll(".sorter__buttons button"));
      var search = document.getElementById("list-search");
      var status = document.getElementById("sort-status");
      var recs = [].slice.call(list.querySelectorAll(".rec"));
      var mode = "type";

      // one lowercase haystack per entry, so "gibson" and "film" both hit
      recs.forEach(function (r) {
        r._hay = [
          r.textContent,
          r.getAttribute("data-author"),
          r.getAttribute("data-universe"),
          r.getAttribute("data-type"),
          r.getAttribute("data-year")
        ].join(" ").toLowerCase();
      });

      var TYPE_LABEL = { book: "books", essay: "essays and manifestos", film: "films",
                         tv: "tv and anime", game: "games", audio: "audio" };
      var TYPE_ORDER = ["book", "essay", "film", "tv", "game", "audio"];

      function year(r) {
        var y = parseInt(r.getAttribute("data-year"), 10);
        return isNaN(y) ? 9999 : y;
      }
      function byYear(a, b) { return year(a) - year(b); }
      function attr(r, n) { return r.getAttribute(n) || ""; }

      function section(label, rows) {
        var sec = document.createElement("section");
        sec.className = "rec-group";
        if (label) {
          var h = document.createElement("h3");
          h.className = "rec-group__title";
          h.textContent = label;
          sec.appendChild(h);
        }
        var dl = document.createElement("dl");
        dl.className = "recs";
        rows.forEach(function (r) { dl.appendChild(r); });
        sec.appendChild(dl);
        return sec;
      }

      function render() {
        var q = (search && search.value || "").trim().toLowerCase();
        var rows = q ? recs.filter(function (r) { return r._hay.indexOf(q) !== -1; }) : recs.slice();

        list.innerHTML = "";

        if (!rows.length) {
          var none = document.createElement("p");
          none.className = "rec-empty";
          none.textContent = "nothing matches \u201c" + q + "\u201d. it might still belong on the list, though.";
          list.appendChild(none);
          if (status) status.textContent = "no matches";
          return;
        }

        // decades, not one long run
        if (mode === "year") {
          var decades = {}, dkeys = [];
          rows.forEach(function (r) {
            var y = parseInt(r.getAttribute("data-year"), 10);
            var k = isNaN(y) ? "" : String(Math.floor(y / 10) * 10) + "s";
            if (!decades[k]) { decades[k] = []; dkeys.push(k); }
            decades[k].push(r);
          });
          dkeys.sort(function (a, b) {
            if (!a) return 1;            // no date, goes last
            if (!b) return -1;
            return parseInt(a, 10) - parseInt(b, 10);
          });
          dkeys.forEach(function (k) {
            list.appendChild(section(k || "no date", decades[k].sort(byYear)));
          });
          if (status) status.textContent = "grouped by decade, " + dkeys.length + " decades";
          return;
        }

        if (mode === "title" || mode === "author") {
          var key = mode === "title" ? "data-title" : "data-author";
          rows.sort(function (a, b) {
            var an = attr(a, key), bn = attr(b, key);
            if (!an && !bn) return byYear(a, b);
            if (!an) return 1;
            if (!bn) return -1;
            if (an === bn) return byYear(a, b);
            return an.localeCompare(bn);
          });
          list.appendChild(section("", rows));
        } else {
          var groups = {}, keys = [];
          rows.forEach(function (r) {
            var k = mode === "type" ? attr(r, "data-type") : attr(r, "data-universe");
            if (!groups[k]) { groups[k] = []; keys.push(k); }
            groups[k].push(r);
          });
          if (mode === "type") {
            keys.sort(function (a, b) { return TYPE_ORDER.indexOf(a) - TYPE_ORDER.indexOf(b); });
          } else {
            keys.sort(function (a, b) {
              if (!a) return 1;          // no universe, goes last
              if (!b) return -1;
              return a.localeCompare(b);
            });
          }
          keys.forEach(function (k) {
            var label = mode === "type" ? (TYPE_LABEL[k] || k) : (k || "everything else");
            list.appendChild(section(label, groups[k].sort(byYear)));
          });
        }

        if (status) {
          status.textContent = q
            ? rows.length + " of " + recs.length + " showing for \u201c" + q + "\u201d"
            : recs.length + " entries, sorted by " + (mode === "type" ? "media type" : mode);
        }
      }

      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          mode = btn.getAttribute("data-sort");
          buttons.forEach(function (b) {
            b.setAttribute("aria-pressed", b === btn ? "true" : "false");
          });
          render();
        });
      });

      if (search) {
        search.addEventListener("input", render);
        search.addEventListener("search", render);   // the little x in safari
      }
    })();
  </script>

</body>
</html>
