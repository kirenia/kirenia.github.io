---
layout: default
---
<article class="page">
  {%- if page.title %}<h1 class="page-title">{{ page.title | escape }}</h1>{% endif -%}

  {%- if page.sticker -%}
    {% include sticker.html name=page.sticker class="sticker--right" tilt=page.sticker_tilt %}
  {%- endif -%}

  <div class="post-content">
    {{ content }}
  </div>
</article>
